[project]
name = "tax-declaration-elster"
version = "0.1.0"
description = "Python tool for automating Elster tax declaration form filling"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.38.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "lxml>=4.9.0",
    "openpyxl>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "pyright>=1.1.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
elster-fill = "tax_declaration_elster.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
